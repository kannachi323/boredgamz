# Local development database only. Production uses ../compose.yaml.
# The Go server applies migrations on startup, so no init scripts are needed.
services:
  db:
    container_name: boredgamz-db
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boredgamz}
      POSTGRES_USER: ${POSTGRES_USER:-boredgamz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boredgamz-dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - boredgamz-dev-data:/var/lib/postgresql/data

volumes:
  boredgamz-dev-data:
