name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: boredgamz_test
          POSTGRES_USER: boredgamz
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boredgamz -d boredgamz_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://boredgamz:ci-only-password@localhost:5432/boredgamz_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  container:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t boredgamz:ci .
      - run: |
          docker network create bg
          docker run -d --name db --network bg -e POSTGRES_DB=boredgamz -e POSTGRES_USER=boredgamz -e POSTGRES_PASSWORD=ci-only-password postgres:17.5-alpine
          docker run -d --name boredgamz --network bg -p 3000:3000 \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e DATABASE_URL='postgres://boredgamz:ci-only-password@db:5432/boredgamz?sslmode=disable' \
            -e JWT_SECRET_KEY=ci-only-secret-0123456789abcdef0123456789 \
            --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges boredgamz:ci
      - run: |
          for attempt in $(seq 1 30); do
            wget -q -O - http://127.0.0.1:3000/readyz && exit 0
            sleep 1
          done
          docker logs boredgamz
          exit 1
