services:
  database:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boredgamz}
      POSTGRES_USER: ${POSTGRES_USER:-boredgamz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - boredgamz-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  boredgamz:
    build:
      context: .
    image: boredgamz:local
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-boredgamz}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-boredgamz}?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    ports:
      - "${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      database:
        condition: service_healthy

volumes:
  boredgamz-data:
